# 每次推送：Windows 上编译、跑核心测试和回归测试；Linux、macOS 上跑核心测试，并检查 src/ui 能编译
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 编译
        shell: cmd
        run: build.cmd "%RUNNER_TEMP%\DeskNote.exe"
      - name: 核心测试
        shell: cmd
        run: tests\coretest.cmd
      - name: 回归测试
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\selftest.ps1
      - name: 上传编译好的 exe
        uses: actions/upload-artifact@v4
        with:
          name: DeskNote-exe
          path: ${{ runner.temp }}\DeskNote.exe

  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 核心测试 + 界面代码编译检查
        run: sh tests/coretest.sh
